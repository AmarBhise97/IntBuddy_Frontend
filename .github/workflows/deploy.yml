name: Frontend CI/CD

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
          --build-arg VITE_API_URL=/api \
          -t ${{ secrets.DOCKER_USERNAME }}/intbuddy-frontend:latest \
          -t ${{ secrets.DOCKER_USERNAME }}/intbuddy-frontend:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/intbuddy-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/intbuddy-frontend:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            echo "========== Frontend Deployment Started =========="

            docker network create intbuddy-network || true

            if [ ! -d /opt/intbuddy/IntBuddy_Frontend/.git ]; then
              git clone https://github.com/AmarBhise97/IntBuddy_Frontend.git /opt/intbuddy/IntBuddy_Frontend
            fi

            cd /opt/intbuddy/IntBuddy_Frontend

            git fetch origin main

            git reset --hard origin/main

            docker compose pull

            docker compose up -d --remove-orphans

            # Reload the edge proxy so it re-resolves the frontend container
            docker exec intbuddy-nginx nginx -s reload || true

            docker image prune -f

            docker compose ps

            echo "========== Frontend Deployment Completed =========="
